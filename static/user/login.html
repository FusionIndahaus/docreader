<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход</title>
  <link rel="stylesheet" href="/static/main-general.css" />
  <link rel="stylesheet" href="/static/main-light.css" />
  <link rel="stylesheet" href="/static/main-dark.css" />
  <link rel="stylesheet" href="/static/user/styles-login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="/static/user/login.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="theme-switcher">
      <input type="checkbox" id="themeSwitch" aria-label="Переключить тему">
      <label for="themeSwitch" class="switch">
        <span class="switch-glow"></span>
        <span class="switch-icon sun">☀️</span>
        <span class="switch-icon moon">🌙</span>
      </label>
    </div>
    <a href="/user/dashboard" class="nav-link">Личный кабинет</a>
  </nav>
  <div class="theme-bg theme-bg--light" aria-hidden="true"></div>
  <div class="theme-bg theme-bg--dark" aria-hidden="true"></div>
  <div class="background-effects" aria-hidden="true"></div>
  
  <div class="card">
    <h1>Вход</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required />
      <label for="password">Пароль</label>
      <input id="password" type="password" required />
      <button class="btn" type="submit">Войти</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  
  <script>
    // Переключение темы
    const themeSwitch = document.getElementById('themeSwitch');
    const htmlElement = document.documentElement;
    
    // Загружаем сохранённую тему из localStorage или используем текущую
    const savedTheme = localStorage.getItem('theme') || htmlElement.getAttribute('data-theme') || 'light';
    htmlElement.setAttribute('data-theme', savedTheme);
    themeSwitch.checked = savedTheme === 'dark';
    
    // Обработчик изменения переключателя темы
    themeSwitch.addEventListener('change', function() {
      const newTheme = this.checked ? 'dark' : 'light';
      htmlElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
  </script>
</body>
</html>
